[project]
name = "vit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.2.0",
    "detectors>=0.1.11",
    "einops>=0.8.1",
    "hydra-core>=1.3.2",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.7",
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
    "scipy>=1.16.1",
    "timm>=1.0.22",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.1",
    "wandb>=0.22.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "basedpyright>=1.39.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.basedpyright]
exclude = [".venv/", "**/*.ipynb"]
typeCheckingMode = "standard"
failOnWarnings = true
reportAny = false
reportExplicitAny = false
reportPrivateImportUsage = false

[tool.ruff]
line-length = 100
exclude = [ "*.ipynb", "**/*.ipynb", ".ipynb_checkpoints", ".venv/" ]
